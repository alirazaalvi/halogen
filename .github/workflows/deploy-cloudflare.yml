name: Deploy to Cloudflare

# Manual. Needs repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID, and the
# variable API_URL (the deployed API worker URL, used when building the web app).
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy API worker
        working-directory: backend
        run: |
          bun install
          bun run cf:deploy
      - name: Deploy web app
        working-directory: frontend
        env:
          VITE_BACKEND_API_URL: ${{ vars.API_URL }}
        run: |
          npm ci
          npm run cf:deploy
